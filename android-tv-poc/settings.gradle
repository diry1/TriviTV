pluginManagement {
 repositories { maven { url 'https://dl.google.com/dl/android/maven2/' }; mavenCentral(); gradlePluginPortal() }
 resolutionStrategy { eachPlugin {
  if (requested.id.id == 'com.android.application') useModule("com.android.tools.build:gradle:${requested.version}")
  if (requested.id.id == 'org.jetbrains.kotlin.android') useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:${requested.version}")
 } }
}
dependencyResolutionManagement { repositories { maven { url 'https://dl.google.com/dl/android/maven2/' }; mavenCentral() } }
rootProject.name = 'TriviTV'
include ':app'
