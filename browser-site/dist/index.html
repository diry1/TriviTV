<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101323" />
    <title>TriviTV · A little friendly competition</title>
    <link rel="stylesheet" href="/styles.css" />
